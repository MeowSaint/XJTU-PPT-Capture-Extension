name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  unit-and-package:
    name: Node 20 tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run test:release

  browser:
    name: Local course browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'
          package-manager-cache: false
      - run: npm ci
      - name: Install Chromium and media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg poppler-utils
          npx --no-install playwright install --with-deps chromium
      - run: npm run test:features
      - run: npm run test:review
      - run: npm run test:bridge
      - run: npm run test:integration
      - run: npm run test:memory
